version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: elite_track_mysql
    environment:
      MYSQL_ROOT_PASSWORD: 2003
      MYSQL_DATABASE: elite_track
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build: .
    container_name: elite_track_backend
    ports:
      - "3001:3001"
    environment:
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: 2003
      DB_NAME: elite_track
      JWT_SECRET: elitetrack_secret_2026_CHANGE_IN_PROD
      NODE_ENV: production
      FRONTEND_URL: http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: elite_track_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data: